# Render Blueprint configuration for NovaTask Project Management Tool
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: novatask
    env: node
    plan: free
    region: oregon # Select the region closest to your MongoDB Atlas cluster (e.g., oregon, frankfurt, singapore)
    buildCommand: npm ci --prefix server && npm ci --include=dev --prefix client && npm run build --prefix client
    startCommand: node server/src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
